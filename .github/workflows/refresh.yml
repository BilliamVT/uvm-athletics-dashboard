name: Refresh dashboard

on:
  schedule:
    # Once a day at 11:00 UTC (6 a.m. EST / 7 a.m. EDT), after the previous night's games are final.
    - cron: "0 11 * * *"
  workflow_dispatch: # lets you run it by hand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape and build
        run: python uvm_dashboard.py --refresh

      - name: Prepare site
        run: |
          mkdir -p _site
          cp dashboard.html _site/index.html
          cp data.json _site/data.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
