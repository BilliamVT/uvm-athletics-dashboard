name: Refresh dashboard

on:
  schedule:
    # Goal: 5 a.m. Eastern every day, after the previous night's games are final.
    # GitHub cron only speaks UTC, so schedule both possible times and let the
    # "gate" job keep the one that is 5 a.m. in New York today:
    #   09:00 UTC = 5 a.m. EDT (summer)     10:00 UTC = 5 a.m. EST (winter)
    - cron: "0 9 * * *"
    - cron: "0 10 * * *"
  workflow_dispatch: # lets you run it by hand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: write # only for the keepalive step below
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Keep the schedule alive
        # GitHub disables scheduled workflows in public repos after 60 days without
        # repository activity. Re-enabling the workflow through the API counts as
        # activity and resets that timer, so no dummy commits are needed.
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/refresh.yml/enable"

      - id: check
        name: Is it the 5 a.m. Eastern run?
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          # Pushes and manual runs always build.
          if [ "$EVENT" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Decide from which cron fired (not the clock), so a delayed start still counts.
          zone=$(TZ=America/New_York date +%Z)
          if { [ "$zone" = "EDT" ] && [ "$SCHEDULE" = "0 9 * * *" ]; } ||
             { [ "$zone" = "EST" ] && [ "$SCHEDULE" = "0 10 * * *" ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping: '$SCHEDULE' is not 5 a.m. in New York while on $zone"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape and build
        run: python uvm_dashboard.py --refresh

      - name: Prepare site
        run: |
          mkdir -p _site
          cp dashboard.html _site/index.html
          cp data.json _site/data.json
          # Home-screen app files: manifest, offline service worker, icons
          cp manifest.webmanifest sw.js _site/
          cp -r icons _site/icons

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
